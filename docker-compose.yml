
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: RaceDay.Api/Dockerfile
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development      # keeps Swagger available at /swagger
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=RaceDayDb;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True"
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: RaceDay.Api
      Jwt__Audience: RaceDay.Api
      Registration__OrganiserCode: ${ORGANISER_CODE}
      AzureStorage__ConnectionString: ${AZURE_STORAGE_CONNECTION_STRING}
      AzureStorage__ContainerName: raceday-images
    ports:
      - "5062:8080"

  web:
    build:
      context: .
      dockerfile: RaceDay.Web/Dockerfile
    depends_on:
      - api
    environment:
      Api__BaseUrl: http://api:8080/
    ports:
      - "5100:8080"

volumes:
  sqldata:
