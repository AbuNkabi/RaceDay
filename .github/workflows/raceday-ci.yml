
name: RaceDay CI

on:
  push:
    branches: [ "main", "part2-api" ]
  pull_request:
    branches: [ "main", "part2-api" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore RaceDay.sln

      - name: Build solution
        run: dotnet build RaceDay.sln --configuration Release --no-restore

      - name: Run automated tests
        run: dotnet test RaceDay.sln --configuration Release --no-build --verbosity normal

  mvc-docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build MVC Docker image
        run: docker build -f RaceDay.Web/Dockerfile -t raceday-web:part3 .
